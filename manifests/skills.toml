[workspace]
name = "agentic-se-framework"
owner = "Elec"

[repos.mattpocock_upstream]
path = "vendor/mattpocock/upstream"
kind = "upstream"
remote = "https://github.com/mattpocock/skills.git"
default_branch = "main"

[repos.mattpocock_local]
path = "vendor/mattpocock/local"
kind = "release_source"
default_branch = "main"

[repos.core]
path = "core"
kind = "release_source"
default_branch = "main"

[[skill]]
publish_name = "diagnosing-bugs"
repo = "mattpocock_local"
source_path = "skills/engineering/diagnosing-bugs"
publish = true
upstream_repo = "mattpocock_upstream"
upstream_path = "skills/engineering/diagnosing-bugs"

